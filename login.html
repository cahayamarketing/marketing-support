<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CSM Marketing System</title>

    <link rel="icon" type="image/png" href="data/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 text-slate-800">

    <main id="loginPage" class="grid min-h-screen lg:grid-cols-2">

        <section class="login-banner hidden lg:flex" aria-label="Informasi sistem">
            <div class="relative z-10 max-w-lg">
                <div class="brand-mark">CSM</div>

                <h1 class="mt-8 text-5xl font-black leading-tight text-white">
                    Marketing Activity Management
                </h1>

                <p class="mt-5 text-lg leading-8 text-red-100">
                    Sistem pengajuan, monitoring, dan evaluasi aktivitas
                    pemasaran Cahaya Sakti Motor.
                </p>
            </div>
        </section>

        <section class="flex items-center justify-center px-6 py-12">
            <div class="w-full max-w-md">

                <div class="mb-8 lg:hidden">
                    <div class="brand-mark brand-mark-red">CSM</div>
                </div>

                <div class="rounded-3xl bg-white p-8 shadow-xl shadow-slate-200/70">
                    <div>
                        <p class="text-sm font-bold uppercase tracking-[0.25em] text-red-600">
                            Selamat datang
                        </p>

                        <h2 class="mt-2 text-3xl font-black text-slate-900">
                            Masuk ke sistem
                        </h2>

                        <p class="mt-2 text-slate-500">
                            Gunakan NIK dan password akun Anda.
                        </p>
                    </div>

                    <form id="loginForm" class="mt-8 space-y-5" novalidate>

                        <div>
                            <label for="username" class="form-label">
                                NIK
                            </label>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                inputmode="numeric"
                                class="form-input"
                                placeholder="Masukkan NIK"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div>
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <div class="relative">
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    class="form-input pr-24"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    id="togglePassword"
                                    type="button"
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-red-600"
                                    aria-label="Tampilkan password"
                                >
                                    Lihat
                                </button>
                            </div>
                        </div>

                        <div
                            id="loginMessage"
                            class="alert-error hidden"
                            role="alert"
                            aria-live="polite"
                        ></div>

                        <button
                            id="loginSubmitButton"
                            type="submit"
                            class="btn-primary flex w-full items-center justify-center gap-2"
                        >
                            <span>Masuk</span>
                        </button>

                        <button
                            id="forgotPasswordButton"
                            type="button"
                            class="w-full text-sm font-bold text-red-600 hover:text-red-700"
                        >
                            Lupa password?
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div
        id="forgotPasswordModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="forgotPasswordTitle"
    >
        <div class="modal-card">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h2 id="forgotPasswordTitle" class="text-xl font-black text-slate-900">
                        Lupa password
                    </h2>

                    <p class="mt-1 text-sm text-slate-500">
                        Masukkan NIK untuk mengajukan reset password.
                    </p>
                </div>

                <button
                    id="closeForgotModal"
                    type="button"
                    class="rounded-lg p-2 text-slate-500 hover:bg-slate-100"
                    aria-label="Tutup modal"
                >
                    ✕
                </button>
            </div>

            <form id="forgotPasswordForm" class="mt-6">
                <label class="form-label" for="forgotUsername">
                    NIK
                </label>

                <input
                    id="forgotUsername"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    autocomplete="username"
                    required
                >

                <p
                    id="forgotMessage"
                    class="mt-3 hidden text-sm"
                    aria-live="polite"
                ></p>

                <button type="submit" class="btn-primary mt-5 w-full">
                    Ajukan reset password
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
